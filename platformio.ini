[platformio]
default_envs = lilygo-t5-epaper

[env:lilygo-t5-epaper]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Esquema de partição ampla para acomodar fontes e dados sem estourar a memória flash
board_build.partitions = huge_app.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -include Arduino.h
    -DLILYGO_T5_EPD47

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
    bblanchon/ArduinoJson @ ^7.4.2

[env:desktop]
platform = native
build_src_filter = -<*> +<../test/test_desktop.cpp>